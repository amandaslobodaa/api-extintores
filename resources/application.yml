server:
  port: 8080
spring:
  profiles:
    active: @activatedProperties@
  datasource:
    url: jdbc:postgresql://localhost:5432/extintores
    username: ${DB_USERNAME}
    password: ${DB_PASSOWRD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    date-format: dd-MM-yyyy

